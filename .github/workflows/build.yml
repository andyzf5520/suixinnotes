name: Build and test mobile apps
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --console=plain
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android simulator interaction tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --console=plain
      - name: Save Android test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-test-evidence
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.txt
      - uses: actions/upload-artifact@v4
        with:
          name: SuixinNotes-Android
          path: app/build/outputs/apk/debug/app-debug.apk
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: cd ios && xcodegen generate
      - name: Build simulator app
        run: xcodebuild -project ios/ShijianNotes.xcodeproj -scheme ShijianNotes -sdk iphonesimulator -configuration Debug -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
      - name: Run iOS tests
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for k,v in d["devices"].items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
          xcodebuild -project ios/ShijianNotes.xcodeproj -scheme ShijianNotes -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO test
      - run: cd ios/build/Build/Products/Debug-iphonesimulator && ditto -c -k --sequesterRsrc --keepParent ShijianNotes.app SuixinNotes-iOS-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SuixinNotes-iOS-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/SuixinNotes-iOS-simulator.zip
