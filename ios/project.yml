name: ShijianNotes
options:
  bundleIdPrefix: com.andy
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '4'
    DEVELOPMENT_TEAM: ''
targets:
  ShijianNotes:
    type: application
    platform: iOS
    sources: [Sources]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andy.shijiannotes
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Simulator.entitlements
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 随心记事本
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UIFileSharingEnabled: NO
  ShijianNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ShijianNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ShijianNotesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: ShijianNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ShijianNotes:
    build:
      targets:
        ShijianNotes: all
    test:
      targets: [ShijianNotesTests, ShijianNotesUITests]
